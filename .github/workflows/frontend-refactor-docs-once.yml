name: One-time frontend refactor spec sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-refactor-docs-once.yml"

permissions:
  contents: write

jobs:
  sync-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update verified frontend implementation status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # spec/README.md
          path = Path("spec/README.md")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "| A1–A3 前端产品合同 | `CONFIRMED` | 预检明细页面、无主键范围替换前端语义、页面—操作—权限—审计矩阵已确认；前端代码尚未实施。 |",
              "| A1–A3 前端产品合同 | `CONFIRMED` | 产品合同已确认；B1–B4 前端实现已完成并通过 ESLint 与 Next.js 生产构建，B5 逐页完整验收仍在进行。 |",
              "README A1-A3 status",
          )
          text = replace_once(
              text,
              "| 前端产品整改 | `PENDING` | 下一工作包按 A1–A3 合同整改路由、菜单、页面、权限公共层和旧模型交互。 |",
              "| 前端产品整改 | `IN_PROGRESS` | 业务系统实例、多对多资源关系、多机构采集链路、Task Version、Precheck Route/Run/明细和权限公共层已实现并构建通过；B5 全页面矩阵验收及真实 API 接入未完成。 |",
              "README frontend remediation status",
          )
          text = replace_once(
              text,
              "| `spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md` | 当前有效、产品合同 | 新增 | 冻结 A1 预检问题明细页面、A2 无主键范围替换前端语义和 A3 页面—操作—权限—审计矩阵；代码尚未实施。 |",
              "| `spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md` | 当前有效、产品合同 | 新增并持续维护 | 冻结 A1–A3 产品合同；B1–B4 前端实现已完成并验证，B5 与真实 API/物理模型仍未完成。 |",
              "README contract index",
          )
          path.write_text(text, encoding="utf-8")

          # spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md
          path = Path("spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "> 前端实现状态：`NOT_IMPLEMENTED`  ",
              "> 前端实现状态：`IN_PROGRESS`；B1–B4 已实现并通过 ESLint 与 Next.js 生产构建，B5 与真实 API 接入未完成  ",
              "contract top implementation status",
          )

          start = "## 23. 当前前端实现差异清单\n"
          end = "\n## 24. A3 通用验收条件"
          if text.count(start) != 1 or text.count(end) != 1:
              raise RuntimeError("contract section 23 markers not unique")
          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          section = '''## 23. 前端实施结果与剩余差异

### 23.1 2026-08-17 已完成并验证

| 原差异 | 当前实现结果 |
| --- | --- |
| 存在“业务目录”页面 | 已删除；HIS/LIS/PACS/EMR 收敛为业务系统实例的 `systemType` |
| 缺少业务系统实例 | 已新增类型、Mock、页面、编辑器、路由及机构/Source 多对多维护 |
| Source 固定归属一家机构和业务目录 | 已取消直属关系；Source 作为独立逻辑数据库连接，由系统实例多对多关联 |
| Route 固定单机构并带启停/结构 Gate | 已改为 Instance + Source + Dataset + Source Object + Target + Institution Set；删除 Route status 和旧式独立结构 Gate |
| Task 当前配置可原地编辑、没有 Task Version | 已拆分稳定 Task 身份与不可变 Task Version，并提供创建新版本与版本历史 |
| 预检列表以 Run 为顶层、详情只有汇总 | 已改为 Route 顶层、Run 历史事实，并实现运行概览、问题汇总、问题明细、脱敏/原值查看和导出交互 |
| RAW 保留固定显示 1 天 | 已改为可配置保留期和 AVAILABLE/EXPIRING/CLEANING/EXPIRED/CLEAN_FAILED 状态 |
| Source/Target 分成两个主菜单 | 已合并为“数据源管理”两个页签 |
| 缺少校验策略、Doris 建表、账号与权限页面 | 已补齐页面和稳定 URL；权限公共层支持菜单、页面、按钮与敏感操作权限判断 |
| 侧栏显示“技术模型已冻结” | 已改为“阶段 1 · IN_PROGRESS / 后端与物理模型仍在 Review” |

实现提交已经执行以下验证：

```text
npm ci
npm run lint
npm run build
```

三项均在 GitHub Actions 中成功。

### 23.2 仍未完成

- B5 仍需按 A3 矩阵逐页核对全部按钮、筛选、分页、空状态、冲突状态和权限状态；
- 当前前端仍使用 Mock，尚未接入真实 REST API；
- 前端权限仅实现产品交互层，服务端权限校验和真实审计持久化尚未实施；
- 预检明细物理载体、保留期限默认值、Doris 机构范围原子替换及 Flyway 表结构仍处于 Review；
- 本轮前端实现不代表后端、数据库或物理模型已经冻结。
'''
          text = before + section + end + after

          text = replace_once(
              text,
              "| 前端代码实施 | `PENDING` | 下一工作包按本文整改路由、菜单、页面、Mock 模型和全部操作 |",
              "| 前端代码实施 | `IN_PROGRESS` | B1–B4 已实现并通过 ESLint/生产构建；B5 全页面矩阵验收和真实 API 接入仍待完成 |",
              "contract bottom implementation row",
          )
          text = replace_once(
              text,
              "```text\nB1：按目标信息架构整改路由和菜单\nB2：实现 A1 预检 Route/Run/汇总/明细页面\nB3：统一 A2 无主键任务文案和确认交互\nB4：建立权限指令、危险确认和审计调用的前端公共层\nB5：按 A3 矩阵逐页消除空按钮和旧模型交互\n```",
              "```text\nB1：COMPLETED——目标信息架构、路由和菜单已整改\nB2：COMPLETED——A1 Precheck Route/Run/汇总/明细页面已实现\nB3：COMPLETED——A2 无主键机构范围替换文案和确认交互已统一\nB4：COMPLETED——页面/按钮/敏感操作权限公共层已建立\nB5：IN_PROGRESS——继续逐页消除空按钮、旧交互并完成完整验收\n```",
              "contract next work package",
          )
          path.write_text(text, encoding="utf-8")

          # spec/TASKS.md
          path = Path("spec/TASKS.md")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "> A1–A3 产品合同：`CONFIRMED`；前端代码实施：`PENDING`；权威合同见 `spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md`  ",
              "> A1–A3 产品合同：`CONFIRMED`；前端代码实施：`IN_PROGRESS`（B1–B4 已构建验证，B5/真实 API 未完成）；权威合同见 `spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md`  ",
              "TASKS top frontend status",
          )
          text = replace_once(
              text,
              "> 前端实现状态：`PENDING`  ",
              "> 前端实现状态：`IN_PROGRESS`；B1–B4 已实现并通过 ESLint 与 Next.js 生产构建，B5 未完成  ",
              "TASKS package status",
          )
          replacements = {
              "- [ ] `B1`：按目标信息架构整改路由和菜单。": "- [x] `B1`：按目标信息架构整改路由和菜单。",
              "- [ ] `B2`：实现 A1 预检 Route/Run/汇总/明细页面。": "- [x] `B2`：实现 A1 预检 Route/Run/汇总/明细页面。",
              "- [ ] `B3`：统一 A2 无主键任务文案和确认交互。": "- [x] `B3`：统一 A2 无主键任务文案和确认交互。",
              "- [ ] `B4`：建立权限指令、危险确认和审计调用的前端公共层。": "- [x] `B4`：建立权限指令、危险确认和审计调用的前端公共层。",
          }
          for old, new in replacements.items():
              text = replace_once(text, old, new, f"TASKS {old[6:8]}")
          text = replace_once(
              text,
              "A1–A3 勾选完成只表示产品合同完成；B1–B5 未完成前，不得将前端状态标记为 `IMPLEMENTED` 或 `VERIFIED`。",
              "B1–B4 已完成前端 Mock/产品交互实现并通过 `npm ci`、ESLint 和 Next.js 生产构建；B5、真实 API、服务端权限及数据库持久化未完成，因此前端总体状态仍为 `IN_PROGRESS`，不能标记为端到端 `VERIFIED`。",
              "TASKS completion boundary",
          )
          path.write_text(text, encoding="utf-8")
          PY

          grep -F '前端产品整改 | `IN_PROGRESS`' spec/README.md
          grep -F '前端实现状态：`IN_PROGRESS`' spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md
          grep -F -- '- [x] `B4`：建立权限指令、危险确认和审计调用的前端公共层。' spec/TASKS.md
          grep -F -- '- [ ] `B5`：按 A3 矩阵逐页消除空按钮和旧模型交互。' spec/TASKS.md

      - name: Commit spec status and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/README.md spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md spec/TASKS.md
          git rm .github/workflows/frontend-refactor-docs-once.yml
          git commit -m "docs(spec): record verified frontend domain refactor"
          git push origin HEAD:main
