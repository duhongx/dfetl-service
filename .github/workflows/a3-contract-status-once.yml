name: Finalize A3 contract status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a3-contract-status-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align final A3 status
        run: python scripts/fix_frontend_contract_status.py
      - name: Commit and remove temporary files
        run: |
          rm -f scripts/fix_frontend_contract_status.py
          rm -f .github/workflows/a3-contract-status-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(spec): align final A3 implementation status"
          git push origin HEAD:main
