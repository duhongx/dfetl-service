name: Finalize A3 interactions and API contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a3-finalize-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic A3 patch
        run: python scripts/finalize_a3.py

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Commit verified result and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/finalize_a3.py
          find .github/workflows -maxdepth 1 -type f \( -name '*once*.yml' -o -name '*refactor*.yml' -o -name '*overlay*.yml' \) ! -name 'frontend-check.yml' -delete
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(web): complete A3 interactions and freeze API contract"
          git push origin HEAD:main
