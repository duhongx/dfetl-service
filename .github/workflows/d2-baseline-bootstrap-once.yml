name: One-time D2 PostgreSQL baseline materialization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d2-baseline-bootstrap-once.yml"

permissions:
  contents: write

concurrency:
  group: d2-baseline-bootstrap
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dfetl_v1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dfetl_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dfetl_v1
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize and statically validate signed D2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .d2-baseline/bundle.tar.xz
          chmod +x scripts/validate_database_baseline.py
          python scripts/validate_database_baseline.py

      - name: Execute V1 against a clean PostgreSQL 16 database
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --set=ON_ERROR_STOP=1 --file=server/src/main/resources/db/migration/V1__baseline.sql
          test "$(psql -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='df_etl' AND c.relkind IN ('r','p');")" = "79"
          test "$(psql -Atc "SELECT count(*) FROM df_etl.security_permission;")" = "106"
          test "$(psql -Atc "SELECT count(*) FROM df_etl.security_role WHERE built_in;")" = "4"
          test "$(psql -Atc "SELECT count(*) FROM df_etl.user_account;")" = "0"
          test "$(psql -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='df_etl' AND c.relkind='r' AND c.relname LIKE 'qrtz_%';")" = "11"

      - name: Commit verified D2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .d2-baseline
          rm -f .github/workflows/d2-baseline-bootstrap-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(db): add PostgreSQL V1 baseline and physical dictionary"
          git push origin HEAD:main
