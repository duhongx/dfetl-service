name: Finalize C1-C3 signoff status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/c1-c3-signoff-status-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align C1-C3 and signoff status
        run: python scripts/finalize_c1_c3_signoff_status.py

      - name: Validate document invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F '状态：`READY_FOR_SIGNOFF`' spec/TARGET_METADATA_MODEL.md
          grep -F '## 5.2 C1–C3 物理设计和签字门槛' spec/TASKS.md
          grep -F 'P0_PRECHECK_DETAIL_PHYSICAL_DESIGN.md' spec/README.md
          grep -F '后端与物理模型状态：`READY_FOR_SIGNOFF`' spec/FRONTEND_PRODUCT_CONTRACTS_A1_A3.md
          grep -F '当前实施授权：`NO`' spec/PHASE1_TARGET_MODEL_SIGNOFF.md

      - name: Commit and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/finalize_c1_c3_signoff_status.py
          rm -f .github/workflows/c1-c3-signoff-status-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(spec): mark C1-C3 ready for target signoff"
          git push origin HEAD:main
