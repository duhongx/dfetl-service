name: Finalize A3 core operation matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a3-core-finalize-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic A3 core patches
        run: |
          python scripts/a3_patch_common.py
          python scripts/a3_patch_resources.py
          python scripts/a3_patch_dataset_route.py
          python scripts/a3_patch_precheck_monitor.py
          python scripts/a3_patch_validation.py

      - name: Upload generated source for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: generated-a3-source
          path: web/app/etl/app-shell-final.tsx
          retention-days: 1

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Commit verified result and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/a3_patch_*.py
          rm -f .github/workflows/a3-core-finalize-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(web): complete A3 core operation matrix"
          git push origin HEAD:main
