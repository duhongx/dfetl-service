name: Apply confirmed phase 1 task document corrections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase1-tasks-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch task document
        run: python .github/scripts/phase1_tasks_doc_patch.py

      - name: Commit task document
        run: |
          git config user.name "duhongx"
          git config user.email "493876059@qq.com"
          git add spec/TASKS.md
          git diff --cached --check
          git commit -m "docs: align tasks with mandatory validation and precheck facts"
          git push origin HEAD:main
