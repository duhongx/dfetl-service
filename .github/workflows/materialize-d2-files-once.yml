name: Materialize D2 SQL and documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-d2-files-once.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and validate D2 files
        shell: bash
        run: |
          set -euo pipefail
          test -f .d2-baseline/bundle.tar.xz
          tar -xJf .d2-baseline/bundle.tar.xz
          test -s server/src/main/resources/db/migration/V1__baseline.sql
          test -s spec/P0_POSTGRESQL_PHYSICAL_TABLE_DICTIONARY.md
          test -s spec/D2_POSTGRESQL_BASELINE_IMPLEMENTATION.md
          test -s scripts/generate_postgresql_v1_dictionary.py
          test -s scripts/validate_postgresql_v1.py
          test -s .github/workflows/database-baseline-check.yml
          python scripts/validate_postgresql_v1.py server/src/main/resources/db/migration/V1__baseline.sql
          python scripts/generate_postgresql_v1_dictionary.py --check
          test "$(wc -l < server/src/main/resources/db/migration/V1__baseline.sql)" -ge 2600
          grep -F '# P0 PostgreSQL 物理表字典' spec/P0_POSTGRESQL_PHYSICAL_TABLE_DICTIONARY.md
          grep -F '# D2 PostgreSQL 物理字典与 V1 实施记录' spec/D2_POSTGRESQL_BASELINE_IMPLEMENTATION.md

      - name: Commit permanent D2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git show 8b7db4610508d9381c5fe4510757f058c5917b44:.github/workflows/openapi-check.yml > .github/workflows/openapi-check.yml
          rm -rf .d2-baseline
          rm -f .github/workflows/d2-baseline-bootstrap-once.yml
          rm -f .github/workflows/materialize-d2-files-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(db): add PostgreSQL V1 baseline and physical dictionary"
          git push origin HEAD:main
